name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-shared-libs:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate cache key
        id: cache-key
        run: |
          echo "key=libs-${{ runner.os }}-${{ hashFiles('libs/**/package.json', 'libs/**/tsconfig*.json', 'libs/**/src/**/*') }}" >> $GITHUB_OUTPUT

      - name: Cache built libraries
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            libs/shared/types/dist
            libs/shared/e2e-testids/dist
            libs/frontend/styles/dist
          key: ${{ steps.cache-key.outputs.key }}

      - name: Install dependencies
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate types from OpenAPI schema
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: npm run generate-types

      - name: Build shared types library (foundation dependency)
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: npx nx build @f1-app/api-types

      - name: Build e2e-testids library (for testing)
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: npx nx build @f1-app/e2e-testids

      - name: Build frontend-styles library (for UI theming)
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: npx nx build @f1-app/frontend-styles

  lint-and-typecheck:
    runs-on: ubuntu-latest
    needs: build-shared-libs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore cached libraries
        uses: actions/cache@v4
        with:
          path: |
            libs/shared/types/dist
            libs/shared/e2e-testids/dist
            libs/frontend/styles/dist
          key: ${{ needs.build-shared-libs.outputs.cache-key }}

  
      - name: Verify shared libraries
        run: |
          echo "Checking if shared libraries are built..."
          ls -la libs/shared/types/dist/ || echo "Types not found"
          ls -la libs/shared/e2e-testids/dist/ || echo "E2E testids not found"
          ls -la libs/frontend/styles/dist/ || echo "Styles not found"

  
      - name: Lint all projects
        run: npx nx run-many --target=lint --all


      - name: Type check e2e-testids library
        run: npx nx run @f1-app/e2e-testids:typecheck

      - name: Type check frontend-styles library
        run: npx nx run @f1-app/frontend-styles:typecheck

      - name: Type check web-app
        run: npx nx run web-app:typecheck

      - name: Type check backend
        run: npx nx run @f1-app/backend:typecheck

      - name: Type check e2e tests
        run: npx nx run e2e:typecheck

  unit-tests:
    runs-on: ubuntu-latest
    needs: [build-shared-libs, lint-and-typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore cached libraries
        uses: actions/cache@v4
        with:
          path: |
            libs/shared/types/dist
            libs/shared/e2e-testids/dist
            libs/frontend/styles/dist
          key: ${{ needs.build-shared-libs.outputs.cache-key }}

      - name: Run unit tests
        run: |
          echo "Running Jest unit tests (excluding e2e and integration tests)"
          npx nx run-many --target=test --all --exclude=e2e --testPathIgnorePatterns=".*\.integration\.test\.ts$" --coverage

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-${{ github.sha }}
          path: coverage
          retention-days: 7

  build-web-app:
    runs-on: ubuntu-latest
    needs: [build-shared-libs, lint-and-typecheck, unit-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore cached libraries
        uses: actions/cache@v4
        with:
          path: |
            libs/shared/types/dist
            libs/shared/e2e-testids/dist
            libs/frontend/styles/dist
          key: ${{ needs.build-shared-libs.outputs.cache-key }}

      - name: Copy font files
        run: node scripts/copy-fonts.js

      - name: Build web-app for production
        run: npx nx build web-app

      - name: Upload web-app build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-app-build-${{ github.sha }}
          path: './dist/apps/frontend/web-app'
          retention-days: 30

  build-backend:
    runs-on: ubuntu-latest
    needs: [build-shared-libs, lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore cached libraries
        uses: actions/cache@v4
        with:
          path: |
            libs/shared/types/dist
            libs/shared/e2e-testids/dist
            libs/frontend/styles/dist
          key: ${{ needs.build-shared-libs.outputs.cache-key }}

      - name: Build backend for production
        run: npx nx build @f1-app/backend

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-${{ github.sha }}
          path: './dist/apps/backend'
          retention-days: 30
