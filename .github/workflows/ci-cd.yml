name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build e2e-testids library
        run: npx nx build @f1-app/e2e-testids

      - name: Build web-app for e2e tests (development mode)
        run: npx nx build web-app --configuration=development

      - name: Build backend for e2e tests
        run: npx nx build @f1-app/backend

  lint-and-test:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build e2e-testids library
        run: npx nx build @f1-app/e2e-testids

      - name: Build web-app for e2e tests (development mode)
        run: npx nx build web-app --configuration=development

      - name: Build backend for e2e tests
        run: npx nx build @f1-app/backend

      - name: Install Playwright browsers (Chromium only for CI)
        run: npx playwright install chromium --with-deps

      - name: Type check e2e tests
        run: npx nx run e2e:typecheck

      - name: Lint all
        run: npx nx run-many --target=lint --all

      - name: Test all
        run: |
          # Run Jest tests first (excluding e2e and integration tests)
          echo "Running Jest tests (excluding e2e and integration tests)"
          npx nx run-many --target=test --all --exclude=e2e --testPathIgnorePatterns=".*\.integration\.test\.ts$" --coverage

          # Run e2e tests (Playwright) - this will start both frontend and backend
          echo "Running e2e tests with Playwright"
          npx nx run e2e:e2e

  build-web-app:
    runs-on: ubuntu-latest
    needs: [ setup, lint-and-test ]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web-app
        run: npx nx build web-app

      - name: Copy font files
        run: node scripts/copy-fonts.js

  build-backend:
    runs-on: ubuntu-latest
    needs: [ setup, lint-and-test ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npx nx build @f1-app/backend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-${{ github.sha }}
          path: './dist/apps/backend'
          retention-days: 30
